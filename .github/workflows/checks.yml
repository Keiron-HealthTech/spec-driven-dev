name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-judges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Judge byte-identity drift check
        run: ./scripts/check-judges.sh

  check-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Command roster set-equality check
        run: ./scripts/check-commands.sh

  check-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envelope, enum, and guard-shape drift check
        run: ./scripts/check-envelope.sh
