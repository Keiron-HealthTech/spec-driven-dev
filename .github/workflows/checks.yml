name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-judges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Judge byte-identity drift check
        run: ./scripts/check-judges.sh

  check-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Command roster set-equality check
        run: ./scripts/check-commands.sh

  check-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envelope, enum, and guard-shape drift check
        run: ./scripts/check-envelope.sh

  check-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review ledger canon and mirror drift check
        run: ./scripts/check-ledger.sh

  check-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Model assignment and silent-inheritance check
        run: ./scripts/check-models.sh
